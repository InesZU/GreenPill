{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 text-center">
    <h1 class="text-6xl font-bold text-gray-800 mb-4">404</h1>
    <h2 class="text-2xl text-gray-600 mb-8">Page Not Found</h2>
    <p class="text-gray-600 mb-8">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('home') }}" class="inline-block bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition-colors">
        Return Home
    </a>
</div>
{% endblock %}
